name: Portfolio | Static checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check site files and references
        run: python3 tests/verify_site.py
      - name: Check JavaScript syntax
        run: node --check assets/site.js